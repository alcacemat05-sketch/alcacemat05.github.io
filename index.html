<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyAI - Tutor de Tareas y Exámenes con IA</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- React 18, ReactDOM y Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0d0d10;
      color: #f1f5f9;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spin-slow 10s linear infinite; }
  </style>
</head>
<body class="antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICONOS SVG ---
    const IconFlame = () => <span className="text-sm">🔥</span>;
    const IconSparkles = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
      </svg>
    );
    const IconSearch = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    );
    const IconPlus = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    );
    const IconX = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );
    const IconCamera = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    );
    const IconMic = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path strokeLinecap="round" strokeLinejoin="round" d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    );
    const IconChevronRight = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    );
    const IconSend = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    );

    // --- FRASES MOTIVACIONALES ---
    const MOTIVATIONAL_QUOTES = [
      '“El éxito es la suma de pequeños esfuerzos repetidos día tras día.” 🚀',
      '“Estás a un paso de dominar esta materia. ¡Confía en tu capacidad!” 💡',
      '“Cada concepto que aprendes hoy es tu ventaja en el examen de mañana.” ✨',
      '“La inteligencia no es cuánto sabes, sino las ganas que tienes de superarte.” 🧠',
      '“Un buen estudiante no es el que nunca falla, sino el que nunca se rinde.” 🔥',
    ];

    const GENERAL_SUBJECTS = [
      'Matemáticas', 'Física', 'Química', 'Informática',
      'Inglés', 'Alemán', 'Español', 'Francés',
      'Biología', 'Geografía', 'Historia', 'Economía',
      'Filosofía', 'Psicología'
    ];

    // --- COMPONENTE PANTALLA DE CARGA MODERNA ---
    function ModernExamLoader({ subject }) {
      const [quoteIndex, setQuoteIndex] = useState(0);
      const [progress, setProgress] = useState(12);

      useEffect(() => {
        const qInt = setInterval(() => setQuoteIndex((p) => (p + 1) % MOTIVATIONAL_QUOTES.length), 3200);
        const pInt = setInterval(() => {
          setProgress((prev) => (prev >= 98 ? 98 : prev + Math.floor(Math.random() * 5 + 3)));
        }, 400);
        return () => { clearInterval(qInt); clearInterval(pInt); };
      }, []);

      return (
        <div className="fixed inset-0 z-50 bg-[#0d0d10]/95 backdrop-blur-2xl flex flex-col items-center justify-between p-6 sm:p-12 text-white">
          <div className="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs font-semibold text-slate-300">
            <IconSparkles className="w-3.5 h-3.5 text-blue-400" />
            <span>Creando examen de {subject || 'Estudio'}</span>
          </div>

          <div className="my-auto flex flex-col items-center text-center max-w-md w-full">
            <div className="relative w-52 h-52 mb-8 flex items-center justify-center">
              <div className="absolute inset-0 rounded-full border border-blue-500/20 animate-ping opacity-30" />
              <div className="absolute inset-2 rounded-full border-2 border-transparent border-t-blue-500 border-r-indigo-500 border-b-cyan-400 animate-spin" />
              <div className="w-32 h-32 rounded-full bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 p-[2px] shadow-[0_0_60px_rgba(37,99,235,0.6)] flex items-center justify-center">
                <div className="w-full h-full rounded-full bg-[#121217] flex flex-col items-center justify-center">
                  <span className="text-4xl font-extrabold font-mono text-white tracking-tight">{progress}%</span>
                  <span className="text-[10px] text-blue-400 font-semibold uppercase mt-0.5 tracking-wider">Procesando</span>
                </div>
              </div>
            </div>

            <div className="w-full p-4 rounded-2xl bg-[#181820]/90 border border-white/10 shadow-xl">
              <p className="text-[11px] font-bold uppercase tracking-wider text-amber-400 mb-1.5">⚡ Frase de motivación</p>
              <p className="text-xs sm:text-sm font-medium text-slate-200 italic leading-relaxed">
                {MOTIVATIONAL_QUOTES[quoteIndex]}
              </p>
            </div>
          </div>
          <p className="text-xs text-slate-500">Generando preguntas orales con rúbrica y test escrito...</p>
        </div>
      );
    }

    // --- MODAL: ELIGE UNA MATERIA (IMG_8809) ---
    function SubjectPickerModal({ isOpen, onClose, onSelectSubject }) {
      const [search, setSearch] = useState('');
      const [custom, setCustom] = useState('');
      const [isAdding, setIsAdding] = useState(false);

      if (!isOpen) return null;

      const filtered = GENERAL_SUBJECTS.filter((s) => s.toLowerCase().includes(search.toLowerCase().trim()));

      return (
        <div className="fixed inset-0 z-50 bg-[#0d0d10] text-white flex flex-col p-6 sm:p-8 overflow-y-auto">
          <div className="max-w-md w-full mx-auto flex-1 flex flex-col">
            <div className="flex justify-end pt-1 pb-4">
              <button onClick={onClose} className="w-10 h-10 rounded-full bg-[#1c1c22] hover:bg-[#282830] border border-white/10 flex items-center justify-center text-slate-300">
                <IconX className="w-5 h-5" />
              </button>
            </div>
            <h1 className="text-2xl sm:text-3xl font-extrabold text-white text-center mb-6 tracking-tight">Elige una materia</h1>
            
            <div className="relative mb-3">
              <input
                type="text"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Buscar materias"
                className="w-full px-5 py-3.5 pr-12 rounded-full bg-[#1a1a20] border border-white/10 text-sm text-white placeholder:text-slate-500 focus:outline-none"
              />
              <div className="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400"><IconSearch /></div>
            </div>

            {!isAdding ? (
              <button onClick={() => setIsAdding(true)} className="w-full py-3.5 px-4 rounded-full bg-[#1a1a20] hover:bg-[#24242c] border border-white/10 text-sm font-semibold flex items-center justify-center gap-2 mb-6">
                <IconPlus className="w-4 h-4" />
                <span>Agrega tu materia</span>
              </button>
            ) : (
              <div className="flex gap-2 mb-6">
                <input
                  type="text"
                  value={custom}
                  onChange={(e) => setCustom(e.target.value)}
                  placeholder="Nombre de la materia..."
                  className="flex-1 px-4 py-3 rounded-full bg-[#1a1a20] border border-blue-500 text-sm focus:outline-none"
                  autoFocus
                />
                <button
                  onClick={() => { if(custom.trim()) { onSelectSubject(custom.trim()); onClose(); } }}
                  className="px-5 py-3 rounded-full bg-blue-600 text-white font-bold text-xs"
                >
                  Agregar
                </button>
              </div>
            )}

            <p className="text-xs sm:text-sm font-semibold text-slate-300 mb-3 px-1">Materias generales</p>
            <div className="grid grid-cols-2 gap-2.5 pb-8">
              {filtered.map((sub) => (
                <button
                  key={sub}
                  onClick={() => { onSelectSubject(sub); onClose(); }}
                  className="py-3.5 px-4 rounded-2xl bg-[#1a1a20] hover:bg-[#25252e] border border-white/5 text-left text-sm font-semibold text-slate-200 active:scale-95 transition-all"
                >
                  {sub}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- DASHBOARD DE EXÁMENES (IMG_8808) ---
    function ExamsDashboard({ onOpenNewExam, onContinuePrep }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [filter, setFilter] = useState('escuela');

      const preps = [
        { id: '1', title: 'Competencias comunicativas y códigos', progress: 3, time: 'hace 2 días', count: '0 de 5 temas' },
        { id: '2', title: 'Célula Vegetal, Orgánulos Y Funciones', progress: 12, time: 'hace 4 días', count: '1 de 6 temas' },
        { id: '3', title: 'Leyes del Movimiento y Cinemática de Newton', progress: 25, time: 'hace 1 semana', count: '2 de 8 temas' }
      ];

      const filtered = preps.filter(p => p.title.toLowerCase().includes(searchTerm.toLowerCase()));

      return (
        <div className="w-full max-w-xl mx-auto px-4 py-2 flex flex-col flex-1">
          {/* Fila superior: Buscar + Nuevo examen */}
          <div className="flex items-center justify-between gap-3 mb-6">
            <div className="flex items-center gap-2 px-4 py-2 rounded-full bg-[#1c1c22] border border-white/10 text-xs font-semibold text-slate-200">
              <IconSearch className="w-3.5 h-3.5 text-slate-400" />
              <input
                type="text"
                placeholder="Buscar"
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="bg-transparent border-none text-xs text-white placeholder:text-slate-400 focus:outline-none w-20"
              />
            </div>

            <button
              onClick={onOpenNewExam}
              className="flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#1c1c22] hover:bg-[#25252c] border border-white/10 text-xs font-semibold text-slate-200 shadow-sm active:scale-95"
            >
              <IconPlus className="w-3.5 h-3.5 text-slate-200" />
              <span>Nuevo examen</span>
            </button>
          </div>

          <div className="flex items-center gap-1 text-base sm:text-lg font-bold text-white mb-4 px-1 cursor-pointer">
            <span>Mis preparaciones de examen</span>
            <IconChevronRight className="w-4 h-4 text-slate-400" />
          </div>

          <div className="space-y-3.5 mb-8">
            {filtered.map((item) => (
              <div key={item.id} className="bg-[#18181d] border border-white/5 rounded-3xl p-5 shadow-xl hover:border-white/15 transition-all">
                <h3 className="text-base font-bold text-white mb-3 tracking-tight">{item.title}</h3>
                <div className="flex items-center gap-3 mb-4">
                  <div className="flex-1 h-1.5 bg-[#25252d] rounded-full overflow-hidden relative">
                    <div className="h-full bg-emerald-400 rounded-full transition-all duration-500 relative" style={{ width: `${Math.max(item.progress, 4)}%` }}>
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-300 absolute right-0 top-1/2 -translate-y-1/2 shadow-[0_0_6px_#34d399]" />
                    </div>
                  </div>
                  <span className="text-xs font-mono font-bold text-slate-400 shrink-0">{item.progress}%</span>
                </div>
                <div className="flex items-center justify-between">
                  <span className="text-xs text-slate-400 font-medium">{item.time} &bull; {item.count}</span>
                  <button
                    onClick={() => onContinuePrep(item.title)}
                    className="px-5 py-2 rounded-full bg-[#2563eb] hover:bg-[#1d4ed8] text-white font-bold text-xs shadow-lg shadow-blue-600/25 active:scale-95 transition-transform"
                  >
                    Continuar
                  </button>
                </div>
              </div>
            ))}
          </div>

          {/* Filtros inferiores: Mi escuela | Mi plan | Exámenes */}
          <div className="mt-auto pt-2 pb-2">
            <div className="w-full bg-[#16161b] border border-white/5 rounded-full p-1 flex items-center justify-between gap-1 shadow-md">
              {['Mi escuela', 'Mi plan de estudios', 'Exámenes'].map((f) => {
                const key = f.toLowerCase().replace(/ /g, '_');
                return (
                  <button
                    key={f}
                    onClick={() => setFilter(key)}
                    className={`flex-1 py-2 px-3 rounded-full text-xs font-semibold transition-all ${
                      filter === key ? 'bg-white text-slate-950 font-bold shadow-sm' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    {f}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // --- APP PRINCIPAL ---
    function App() {
      const [tab, setTab] = useState('chat'); // 'chat' | 'exam'
      const [examView, setExamView] = useState('dashboard'); // 'dashboard' | 'uploader' | 'exam_active'
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [selectedSubject, setSelectedSubject] = useState('Biología');
      const [isLoading, setIsLoading] = useState(false);
      
      const [chatMessages, setChatMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [attachedImg, setAttachedImg] = useState(null);
      const [userName, setUserName] = useState('Mateo');
      const [streak, setStreak] = useState(1);

      // Examen activo generado
      const [activeExam, setActiveExam] = useState(null);
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [oralFeedback, setOralFeedback] = useState(null);
      const [isSpeaking, setIsSpeaking] = useState(false);

      const fileInputRef = useRef(null);

      // Reproducción de voz
      const speak = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const clean = text.replace(/[*#`_]/g, '');
          const u = new SpeechSynthesisUtterance(clean);
          u.lang = 'es-ES';
          u.onstart = () => setIsSpeaking(true);
          u.onend = () => setIsSpeaking(false);
          window.speechSynthesis.speak(u);
        }
      };

      // Simulación de generación con carga ultra-moderna
      const handleGenerateExam = () => {
        setIsLoading(true);
        setTimeout(() => {
          setIsLoading(false);
          setActiveExam({
            title: `Examen de ${selectedSubject}`,
            subject: selectedSubject,
            questions: [
              {
                id: '1',
                question: `Explica en tus propias palabras el concepto fundamental que acabas de estudiar en ${selectedSubject} y por qué es importante.`,
                idealAnswer: 'Debe estructurar la respuesta con definición clara, relación causa-efecto y al menos un ejemplo práctico aplicable.',
              },
              {
                id: '2',
                question: `¿Cuáles son las tres características o pasos principales que definen este proceso en ${selectedSubject}?`,
                idealAnswer: 'Mencionar secuencialmente los tres pasos y cómo interactúan entre sí.',
              }
            ]
          });
          setExamView('exam_active');
          setCurrentQIndex(0);
        }, 4000);
      };

      // Enviar mensaje en el chat
      const handleSendChat = (customText) => {
        const text = customText || inputText;
        if (!text.trim() && !attachedImg) return;

        const newMsg = {
          id: Date.now(),
          role: 'user',
          text: text || 'Resuelve este ejercicio de la foto paso a paso.',
          img: attachedImg
        };

        const updated = [...chatMessages, newMsg];
        setChatMessages(updated);
        setInputText('');
        setAttachedImg(null);

        // Respuesta simulada de tutor
        setTimeout(() => {
          setChatMessages([
            ...updated,
            {
              id: Date.now() + 1,
              role: 'ai',
              text: `📌 **Ejercicio analizado con éxito:**\n\n1. **Datos:** Hemos identificado las variables clave de tu consulta de ${selectedSubject}.\n2. **Procedimiento:** Aplicamos la fórmula conceptual correspondiente paso a paso.\n3. **Resultado:** Procedimiento verificado con rigor pedagógico. ¡Sigue así! 🚀`
            }
          ]);
        }, 1200);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-xl mx-auto px-4 py-3">
          {isLoading && <ModernExamLoader subject={selectedSubject} />}

          {/* Modal de selección de materia (IMG_8809) */}
          <SubjectPickerModal
            isOpen={isModalOpen}
            onClose={() => setIsModalOpen(false)}
            onSelectSubject={(sub) => {
              setSelectedSubject(sub);
              setTab('exam');
              setExamView('uploader');
            }}
          />

          {/* Barra Superior: 🔥 0 y Avatar M (como en la captura) */}
          <header className="flex items-center justify-between py-2 mb-2">
            <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#1c1c22] border border-white/10 text-xs font-semibold">
              <IconFlame />
              <span>{streak}</span>
            </div>
            <div className="w-9 h-9 rounded-full bg-[#2a2a32] border border-white/10 flex items-center justify-center font-bold text-sm text-white">
              {userName.charAt(0).toUpperCase()}
            </div>
          </header>

          {/* VISTA 1: PREGUNTAR (CHAT CON TUTOR) */}
          {tab === 'chat' && (
            <main className="flex-1 flex flex-col justify-center">
              {chatMessages.length === 0 ? (
                <div className="my-auto text-center flex flex-col items-center justify-center py-10">
                  <h1 className="text-2xl sm:text-3xl font-medium tracking-tight text-white mb-6">
                    {userName}, ¡buenas tardes! 🌤️
                  </h1>
                  <button
                    onClick={() => handleSendChat('¡Hola! Necesito ayuda para resolver una tarea paso a paso.')}
                    className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-[#1e1e24] hover:bg-[#282830] border border-white/10 text-white text-sm font-semibold tracking-wide shadow-lg active:scale-95 transition-transform"
                  >
                    <IconSparkles />
                    <span>Comenzar</span>
                  </button>
                </div>
              ) : (
                <div className="flex-1 overflow-y-auto space-y-4 py-4 max-h-[60vh]">
                  {chatMessages.map((m) => (
                    <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[85%] rounded-2xl p-4 text-xs sm:text-sm leading-relaxed ${
                        m.role === 'user' ? 'bg-[#2563eb] text-white' : 'bg-[#18181d] border border-white/10 text-slate-200'
                      }`}>
                        {m.img && <img src={m.img} className="rounded-lg mb-2 max-h-40 w-full object-cover" />}
                        <div className="whitespace-pre-wrap">{m.text}</div>
                        {m.role === 'ai' && (
                          <button onClick={() => speak(m.text)} className="mt-2 text-[10px] text-blue-400 font-bold block">
                            🔊 Escuchar explicación
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {/* VISTA 2: EXÁMENES */}
          {tab === 'exam' && (
            <main className="flex-1 flex flex-col justify-center py-2">
              {examView === 'dashboard' && (
                <ExamsDashboard
                  onOpenNewExam={() => setIsModalOpen(true)}
                  onContinuePrep={(title) => {
                    setSelectedSubject(title);
                    handleGenerateExam();
                  }}
                />
              )}

              {examView === 'uploader' && (
                <div className="bg-[#18181d] border border-white/10 rounded-3xl p-6 text-center">
                  <div className="flex justify-between items-center mb-4">
                    <button onClick={() => setExamView('dashboard')} className="text-xs text-slate-400 hover:text-white">
                      &larr; Volver
                    </button>
                    <span className="text-xs font-bold text-blue-400 px-3 py-1 bg-blue-600/10 rounded-full border border-blue-500/20">
                      {selectedSubject}
                    </span>
                  </div>
                  <h2 className="text-xl font-bold mb-2">Sube fotos de tus apuntes</h2>
                  <p className="text-xs text-slate-400 mb-6">La IA extraerá tus conceptos para tu examen oral y escrito.</p>
                  
                  <div
                    onClick={() => fileInputRef.current.click()}
                    className="border-2 border-dashed border-white/15 rounded-2xl p-8 cursor-pointer hover:border-blue-500 mb-6 bg-[#121215]"
                  >
                    <IconCamera className="w-8 h-8 text-blue-400 mx-auto mb-2" />
                    <p className="text-xs font-semibold text-slate-200">Toca para seleccionar o tomar foto</p>
                  </div>

                  <button
                    onClick={handleGenerateExam}
